# nginx vhost for ecom.flexypdf.com → Next.js on 127.0.0.1:3040 (PM2 "mayura")
#
#   sudo cp deploy/nginx.ecom.conf /etc/nginx/sites-available/ecom.flexypdf.com
#   sudo ln -s /etc/nginx/sites-available/ecom.flexypdf.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d ecom.flexypdf.com      # adds the TLS server block
#
# Nothing here touches other sites on the box: it only claims this server_name.

upstream mayura_app {
    server 127.0.0.1:3040;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name ecom.flexypdf.com;

    # certbot will rewrite this block to redirect to HTTPS once a cert exists.

    client_max_body_size 10m;

    # Long-lived, content-hashed build assets.
    location /_next/static/ {
        proxy_pass http://mayura_app;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Optimised images — cache at the edge for a day.
    location /_next/image {
        proxy_pass http://mayura_app;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=86400";
    }

    location / {
        proxy_pass http://mayura_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_buffering off;
    }

    # Never serve the admin panel from a search engine's cache.
    location /admin {
        proxy_pass http://mayura_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store" always;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;
}
