# nginx vhost for weekendcart.com — the primary domain.
#
# Serves the same Next.js app as ecom.flexypdf.com (PM2 "weekendcart" on
# 127.0.0.1:3040). Both hostnames stay live; because every page emits a
# canonical URL pointing at https://weekendcart.com, Google treats this one as
# the original and the flexypdf host as a duplicate rather than penalising
# either. Nothing here touches other sites on the box.
#
#   sudo cp deploy/nginx.weekendcart.conf /etc/nginx/sites-available/weekendcart.com
#   sudo ln -s /etc/nginx/sites-available/weekendcart.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d weekendcart.com -d www.weekendcart.com

upstream weekendcart_app {
    server 127.0.0.1:3040;
    keepalive 32;
}

# www → apex, so only one hostname is ever indexed.
server {
    listen 80;
    listen [::]:80;
    server_name www.weekendcart.com;
    return 301 https://weekendcart.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name weekendcart.com;

    # certbot rewrites this block to redirect to HTTPS once a cert exists.

    client_max_body_size 10m;

    # Long-lived, content-hashed build assets.
    location /_next/static/ {
        proxy_pass http://weekendcart_app;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Optimised images — cache at the edge for a day.
    location /_next/image {
        proxy_pass http://weekendcart_app;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=86400";
    }

    location / {
        proxy_pass http://weekendcart_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_buffering off;
    }

    # Never let the admin panel reach a search engine's index.
    location /admin {
        proxy_pass http://weekendcart_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store" always;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;
}
