# nginx vhost for staging.weekendcart.com — the rehearsal copy.
#
# Same code as the live shop, its own database, PM2 "weekendcart-staging" on
# 127.0.0.1:3041. Nothing here touches the production vhost or any other site
# on the box.
#
#   sudo cp deploy/nginx.staging.conf /etc/nginx/sites-available/staging.weekendcart.com
#   sudo ln -s /etc/nginx/sites-available/staging.weekendcart.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d staging.weekendcart.com
#
# DNS first: staging → A → 187.127.141.107.
#
# Belt and braces on indexing. The app already serves a blanket "Disallow: /"
# in robots.txt when APP_ENV is not production, and this adds the header that
# stops a page being indexed even when someone links straight to it. A staging
# copy in Google's index competes with the real shop for its own keywords.

upstream weekendcart_staging {
    server 127.0.0.1:3041;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name staging.weekendcart.com;

    # certbot rewrites this block to redirect to HTTPS once a cert exists.

    client_max_body_size 10m;

    # Keep the rehearsal copy behind a password. Create the file first, or
    # nginx -t will fail on a config that points at one that is not there:
    #
    #   sudo apt install -y apache2-utils
    #   sudo htpasswd -c /etc/nginx/.htpasswd-staging weekendcart
    #
    # then uncomment both lines and reload. Worth doing before there is
    # anything on staging worth seeing.
    #
    # auth_basic           "WeekendCart staging";
    # auth_basic_user_file /etc/nginx/.htpasswd-staging;

    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    location /_next/static/ {
        proxy_pass http://weekendcart_staging;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }

    location /_next/image {
        proxy_pass http://weekendcart_staging;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=86400";
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }

    location / {
        proxy_pass http://weekendcart_staging;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_buffering off;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;
}
